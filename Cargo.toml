[package]
name = "postui"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Huy Vu (huyvu8051)"]
description = "A keyboard-driven, vim-style terminal HTTP client: a lightweight Postman alternative"
license = "MIT OR Apache-2.0"
repository = "https://github.com/huyvu8051/postui"
readme = "README.md"
keywords = ["http", "api", "tui", "postman", "vim"]
categories = ["command-line-utilities", "development-tools"]
# Builds against a patched edtui (vendor/edtui via [patch.crates-io]); patches don't
# apply to crates.io packages, so install from git instead of publishing.
publish = false

[dependencies]
anyhow = "1.0.104"
arboard = "3"
chrono = { version = "0.4.45", features = ["serde"] }
crossterm = "0.29"
dirs = "5"
edtui = "0.11"
fuzzy-matcher = "0.3"
mlua = { version = "0.9", features = ["lua54", "vendored", "serialize"] }
open = "5"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tokio = { version = "1.53.1", features = ["full"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

# Vendored edtui with a small patch exposing undo/redo history (see vendor/edtui/Cargo.toml).
[patch.crates-io]
edtui = { path = "vendor/edtui" }
